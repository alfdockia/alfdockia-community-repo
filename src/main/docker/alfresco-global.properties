# RUN TIME PROPERTIES
# -------------------

#
# Alfresco configuration for running locally with PostgreSQL Database
#
# Configuration when running Tomcat embedded from Maven.
# Property values from the POM but it can also be edited here.
#

# Alfresco Repo Webapp (alfresco.war) context, ports etc
alfresco.context=alfresco
alfresco.host=localhost
alfresco.port=8080
alfresco.protocol=http

# Alfresco Share Webapp (share.war) context, ports etc
share.context=share
share.host=localhost
share.port=8180
share.protocol=http

# Don't try and recover any index
index.recovery.mode=NONE

# These jobs seem to require Lucene (Unsupported Operation with Solr) so we disable them / set to future date
# See https://forums.alfresco.com/en/viewtopic.php?f=52&t=41597
# If you want to enable them (and so full WQS functionality), please also set index.subsystem.name=lucene
wcmqs.dynamicCollectionProcessor.schedule=0 30 2 * * ? 2060
wcmqs.feedbackProcessor.schedule=0 40 2 * * ? 2060
wcmqs.publishQueueProcessor.schedule=0 50 2 * * ? 2060

# Fail or not when there are node integrity checker errors
integrity.failOnError=true

# Alfresco Repository PostgreSQL Database configuration.
# The PostgreSQL Driver is brought in via the tomcat7-maven-plugin as a dependency.
db.driver=org.postgresql.Driver

# This Alfresco Platform Configuration file should be used for custom properties that are introduced by this module.
# Define default values for all properties here.
# System Administrators can override these values in environment specific configurations in
# alfresco/tomcat/shared/classes/alfresco-global.properties.
#
index.subsystem.name=solr6
solr.host=alfdockia-ass
solr.port=8983
solr.secureComms=secret
solr.sharedSecret=secret

db.username=alfresco
db.password=alfresco
db.pool.initial=10
db.pool.max=100

db.url=jdbc:postgresql://alfdockia-postgres:5432/alfresco

# File servers related properties
# For local runs we disable CIFS and FTP
cifs.enabled=false
ftp.enabled=false

csrf.filter.enabled=false

# Embedded broker without persistence
messaging.broker.url=vm://localhost?broker.persistent=false

# Transformaciones locales para Alfresco Community.
# No usamos Transform Router/ATS; ACS llama directamente al T-engine por HTTP.
transform.service.enabled=false
local.transform.service.enabled=true
legacy.transform.service.enabled=false
localTransform.anonimizator.url=http://anonimizator-t-engine:8090/
local.transform.service.initialAndOnError.cronExpression=0/10 * * * * ?
rendition.config.dir=shared/classes/alfresco/extension/transform/renditions/

# Alfdockia subsystem defaults for local runs.
alfresco.alfdockia.docker.enabled=true
alfresco.alfdockia.subsystem.autoStart=true
alfresco.alfdockia.subsystem.startAgentsOnStart=true
alfresco.alfdockia.subsystem.stopAgentsOnStop=true
alfresco.alfdockia.subsystem.stopTimeoutSeconds=10
alfresco.alfdockia.docker.mode=socket
alfresco.alfdockia.docker.socket=/var/run/docker.sock
alfresco.alfdockia.docker.network.mode=inherit
# alfresco.alfdockia.docker.network=mi_stack_default
# alfresco.alfdockia.docker.selfContainer=alfresco
alfresco.alfdockia.secret.content_service_password=admin

# Sin licencia valida, AlfDokia Community permite hasta 5 agentes.
# Para pruebas locales puedes montar una licencia en esta ruta y activar una
# clave publica externa. En builds oficiales, usa clave publica embebida.
# alfresco.alfdockia.license.path=/usr/local/tomcat/shared/classes/alfresco/extension/alfdokia.license.json
alfresco.alfdockia.license.allowExternalPublicKey=false
# alfresco.alfdockia.license.publicKeyPath=/usr/local/tomcat/shared/classes/alfresco/extension/alfdokia.public.pem
