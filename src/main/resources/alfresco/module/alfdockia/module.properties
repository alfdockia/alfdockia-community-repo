
# Propiedades del modulo Alfresco. Maven filtra estos valores desde el pom.xml.
# Identidad estable del modulo, independiente del nombre del artefacto Maven.
module.id=alfdockia
module.title=${project.name}
module.description=${project.description}
module.version=${project.version}

