
# Configuracion por defecto del modulo.

# Activa o desactiva la integracion con Docker.
alfresco.alfdockia.docker.enabled=true

# Ciclo de vida del subsistema Alfdockia.
alfresco.alfdockia.subsystem.autoStart=true
alfresco.alfdockia.subsystem.startAgentsOnStart=true
alfresco.alfdockia.subsystem.stopAgentsOnStop=true
alfresco.alfdockia.subsystem.stopTimeoutSeconds=10

# Modo de integracion Docker: socket o url.
alfresco.alfdockia.docker.mode=socket

# Socket local usado cuando mode=socket.
alfresco.alfdockia.docker.socket=/var/run/docker.sock

# Red Docker de los agentes.
# Por defecto hereda dinamicamente la red del contenedor Alfresco.
alfresco.alfdockia.docker.network.mode=inherit
# alfresco.alfdockia.docker.network=mi_stack_default
# alfresco.alfdockia.docker.selfContainer=alfresco

# Propiedades para Docker Remote API cuando mode=url.
# alfresco.alfdockia.docker.baseUrl=https://dockerhost:2376
# alfresco.alfdockia.docker.tls.keystore.path=/opt/alfresco/tls/docker-client.p12
# alfresco.alfdockia.docker.tls.keystore.password=changeit
# alfresco.alfdockia.docker.tls.truststore.path=/opt/alfresco/tls/docker-trust.p12
# alfresco.alfdockia.docker.tls.truststore.password=changeit

# Secreto de ejemplo para la password que consume el listener dinamico.
alfresco.alfdockia.secret.content_service_password=supersecret

# Allowlist opcional de imagenes permitidas.
alfresco.alfdockia.image.allowlist.enabled=false
# alfresco.alfdockia.image.allowlist=cparedes/agents/,ghcr.io/miorg/,registry.local/

# Licenciamiento AlfDokia.
# Sin licencia valida, AlfDokia funciona como Community y permite hasta 5 agentes.
# En builds oficiales, incorpora la clave publica en:
# alfresco/module/alfdockia/license/alfdokia-license-public.pem
# alfresco.alfdockia.license.path=/usr/local/tomcat/shared/classes/alfresco/extension/alfdokia.license.json
alfresco.alfdockia.license.allowExternalPublicKey=false
# Solo para desarrollo/pruebas locales. No activar en builds oficiales.
# alfresco.alfdockia.license.publicKeyPath=/usr/local/tomcat/shared/classes/alfresco/extension/alfdokia.public.pem
